<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="1,000엔으로 즐기는 일본 편의점 야식 산책">
<title>자정의 패밀리마트</title>
<link rel="stylesheet" href="style.css?v=mobile-audio-1">
<script defer src="voices.js"></script>
<script defer src="products.js"></script>
<script defer src="store3d.js"></script>
<script defer src="meal.js"></script>
<script defer src="game.js?v=mobile-audio-1"></script>
</head>
<body>
<main>
  <header>
    <div class="identity"><span class="mark" aria-hidden="true"></span><div><strong>자정의 패밀리마트</strong><small>ミッドナイト・ファミマ</small></div></div>
    <div class="hud">
      <div class="money"><small>지갑</small><strong id="wallet">¥1,000</strong></div>
      <button id="basket" class="money" disabled><small>장바구니 <span id="count">0</span></small><strong id="total">¥0</strong></button>
      <button id="food" class="money" hidden><small>구매한 음식</small><strong id="food-count">0개</strong></button>
      <button id="sound" aria-pressed="false" aria-label="음소거" title="음소거">♪</button>
    </div>
  </header>
  <section class="game" aria-label="패밀리마트 게임" data-time="night">
    <canvas id="scene" width="800" height="480" aria-label="1인칭 3D 편의점"></canvas>
    <div class="location"><i></i><span id="location">매장 앞</span></div>
    <canvas id="minimap" width="138" height="97" aria-label="매장 지도" hidden></canvas>
    <span id="crosshair" aria-hidden="true" hidden></span>
    <div id="prompt" hidden></div>
    <div id="caption" role="status" hidden></div>
    <button id="sound-retry" type="button" hidden>소리 다시 켜기</button>
    <div id="guest-caption" hidden></div>
    <canvas id="meal-motion" width="640" height="440" hidden aria-hidden="true"></canvas>
    <canvas id="carry-motion" width="520" height="380" hidden aria-hidden="true"></canvas>
    <div id="meal-status" role="status" hidden></div>
    <div id="intro">
      <div class="intro-card">
        <div class="eyebrow">コンビニ · 24H OPEN</div>
        <h1><span id="visit-title">자정의</span><br><em>패밀리마트</em></h1>
        <p>주머니 속 1,000엔.<br><span id="visit-copy">오늘 밤엔 뭘 먹을까?</span></p>
        <div class="time-picker" role="group" aria-label="방문 시간">
          <button type="button" data-time-choice="day" aria-pressed="false">☀ 낮</button>
          <button type="button" data-time-choice="night" aria-pressed="true">☾ 밤</button>
        </div>
        <button id="start" class="primary">매장 들어가기 <span aria-hidden="true">↵</span></button>
        <small>자동문을 통과하면 매장 음악이 시작됩니다</small>
      </div>
    </div>
    <div id="overlay" hidden>
      <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <div class="panel-head"><div><div id="panel-kicker" class="eyebrow"></div><h2 id="panel-title"></h2></div><button id="close" aria-label="닫기">×</button></div>
        <div id="panel-body"></div>
      </section>
    </div>
  </section>
  <div class="under">
    <div class="key-guide"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span><span><kbd>←</kbd><kbd>→</kbd> / 드래그 시점</span><span><kbd>E</kbd> 상호작용</span><span><kbd>Esc</kbd> 닫기</span></div>
    <span id="objective">자동문까지 앞으로 이동하세요</span>
    <button id="stand" hidden>벤치에서 일어나기</button>
    <button id="replay" class="primary" hidden>다시 시작</button>
    <div id="local-controls" hidden>
      <button id="load-bgm">내 BGM 열기</button>
      <input id="bgm-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg" hidden>
      <span id="music-status" role="status"></span>
    </div>
  </div>
  <div class="touch" aria-label="터치 조작">
    <div class="dpad"><button data-dir="up" aria-label="앞으로 이동">▲</button><button data-dir="turnLeft" aria-label="왼쪽 보기">◀</button><button data-dir="down" aria-label="뒤로 이동">▼</button><button data-dir="turnRight" aria-label="오른쪽 보기">▶</button></div>
    <small>화면을 밀어<br>둘러보기</small>
    <button id="action" disabled>상호작용</button>
  </div>
</main>
</body>
</html>
